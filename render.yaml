services:
  - type: web
    name: yale-som-courses-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    branch: main
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: yale-som-courses-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    branch: main
    envVars:
      - key: PORTKEY_API_KEY
        sync: false
      - key: PORTKEY_BASE_URL
        value: https://api.portkey.ai/v1
